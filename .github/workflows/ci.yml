name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pywebview is only the desktop launcher (lazy-imported in backend.desktop);
          # the test suite runs headless, so skip the GUI dependency in CI.
          grep -v '^pywebview' requirements.txt > ci-requirements.txt
          python -m pip install -r ci-requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Syntax-check the web frontend
        run: node --check backend/api/static/app.js
